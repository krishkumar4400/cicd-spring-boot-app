name: spring-boot-app

on:
    # push:
    workflow_dispatch:

jobs:
    build-test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Setup JDK
              uses: actions/setup-java@v6
              with:
                  distribution: temurin
                  java-version: "21"

            - name: Build and Test(Maven)
              working-directory: demo/
              run: mvn -B clean verify

            - name: Upload Test Reports
              uses: actions/upload-artifact@v4
              with:
                  name: test-reports
                  path: demo/target/surefire-reports

    docker-build-push:
        runs-on: ubuntu-latest
        needs: build-test

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Setup JDK
              uses: actions/setup-java@v6
              with:
                  distribution: temurin
                  java-version: "21"

            - name: Build JAR for Docker
              working-directory: demo/
              run: mvn -B clean package -DskipTests

            - name: Login to DockerHub
              uses: docker/login-action@v3
              with:
                  username: ${{secrets.DOCKER_USERNAME}}
                  password: ${{secrets.DOCKER_PASSWORD}}

            - name: Build and push Docker Image
              uses: docker/build-push-action@v7
              with:
                  context: /demo
                  push: true
                  tags: |
                      ${{secrets.DOCKER_USERNAME}}/spring-app:latest
                      ${{secrets.DOCKER_USERNAME}}/spring-app:${{github.sha}}
                      ${{secrets.DOCKER_USERNAME}}/spring-app:${{github.ref_name}}

# docs: github actions marketplace
